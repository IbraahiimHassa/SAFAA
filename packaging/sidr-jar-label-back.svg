<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <title>SAFA Sidr Honey — back label</title>
  <rect width="700" height="900" fill="#FBFAF6"/>
  <rect x="14" y="14" width="672" height="872" fill="none" stroke="#26201A" stroke-width="3"/>
  <text x="60" y="92" font-family="Newsreader, Georgia, serif" font-size="34" fill="#26201A">Sidr Honey — the record</text>
  <text x="60" y="126" font-family="Newsreader, serif" font-style="italic" font-size="18" fill="#8A5A17">raw honey of the Sidr tree, one valley, one autumn</text>
  <line x1="60" y1="156" x2="640" y2="156" stroke="#26201A" stroke-width="2.5"/>
  <text x="60" y="196" font-family="Archivo, sans-serif" font-weight="800" font-size="15" letter-spacing="2.5" fill="#8A5A17">NUTRITION — PER 100 G</text>
  <text x="60" y="226" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Energy</text><text x="640" y="226" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">1,400 kJ / 334 kcal</text><line x1="60" y1="234" x2="640" y2="234" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="260" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Fat</text><text x="640" y="260" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">0 g</text><line x1="60" y1="268" x2="640" y2="268" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="294" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Carbohydrate</text><text x="640" y="294" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">82 g</text><line x1="60" y1="302" x2="640" y2="302" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="328" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">— of which sugars</text><text x="640" y="328" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">81 g</text><line x1="60" y1="336" x2="640" y2="336" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="362" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Protein</text><text x="640" y="362" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">0.4 g</text><line x1="60" y1="370" x2="640" y2="370" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="396" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Salt</text><text x="640" y="396" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">0.01 g</text><line x1="60" y1="404" x2="640" y2="404" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
  <line x1="60" y1="446" x2="640" y2="446" stroke="#26201A" stroke-width="2"/>
  <text x="60" y="486" font-family="Archivo, sans-serif" font-weight="800" font-size="15" letter-spacing="2.5" fill="#8A5A17">GOOD TO KNOW</text>
  <text x="60" y="518" font-family="Archivo, sans-serif" font-size="14.5" fill="#26201A">Raw honey may crystallise — that is nature, not a fault. Warm the jar</text>
  <text x="60" y="540" font-family="Archivo, sans-serif" font-size="14.5" fill="#26201A">gently in water below 40 °C to return it to liquid.</text>
  <text x="60" y="572" font-family="Archivo, sans-serif" font-weight="700" font-size="14.5" fill="#26201A">Not suitable for infants under 12 months.</text>
  <text x="60" y="604" font-family="Archivo, sans-serif" font-size="14.5" fill="#26201A">Store at room temperature, away from direct sun.</text>
  <line x1="60" y1="640" x2="640" y2="640" stroke="#26201A" stroke-width="2"/>
  <text x="60" y="680" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Origin</text><text x="640" y="680" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">Wadi Do'an, Hadhramaut, Yemen</text><line x1="60" y1="688" x2="640" y2="688" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="714" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Harvest</text><text x="640" y="714" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">Autumn 2025</text><line x1="60" y1="722" x2="640" y2="722" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="748" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Batch</text><text x="640" y="748" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">SF-25-011</text><line x1="60" y1="756" x2="640" y2="756" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="60" y="782" font-family="Archivo, sans-serif" font-size="15" fill="#26201A">Best before</text><text x="640" y="782" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#26201A">see lid</text><line x1="60" y1="790" x2="640" y2="790" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
  <g transform="translate(60,800)"><rect width="64" height="64" fill="#FFFFFF" stroke="#26201A" stroke-width="1.5"/><g transform="translate(6,6) scale(1.58)" fill="#26201A"><path d="M0 0h9v9H0zM2 2h5v5H2zM24 0h9v9h-9zM26 2h5v5h-5zM0 24h9v9H0zM2 26h5v5H2zM12 0h3v3h-3zM18 3h3v3h-3zM12 6h3v3h-3zM15 9h3v3h-3zM21 12h3v3h-3zM12 12h3v3h-3zM27 12h3v3h-3zM3 12h3v3h-3zM9 15h3v3h-3zM15 15h3v3h-3zM24 18h3v3h-3zM30 18h3v3h-3zM12 21h3v3h-3zM18 21h3v3h-3zM12 27h3v3h-3zM18 27h3v3h-3zM24 24h3v3h-3zM27 27h3v3h-3zM30 30h3v3h-3z"/></g></g>
  <text x="144" y="828" font-family="Archivo, sans-serif" font-size="12.5" fill="#675E53">This jar's pollen analysis &amp; full lab report — scan.</text>
  <text x="640" y="828" text-anchor="end" font-family="Archivo, sans-serif" font-size="11.5" fill="#675E53">SAFA Nutrition B.V. · Amsterdam, NL</text>
  <text x="640" y="848" text-anchor="end" font-family="Archivo, sans-serif" font-size="11.5" fill="#675E53">safanutrition.eu</text>
</svg>