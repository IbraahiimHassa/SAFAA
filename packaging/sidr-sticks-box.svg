<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <title>SAFA Sidr Sticks — box front, 160×112 mm</title>
  <!-- ink box: the companion line is dark, mirroring the collagen house -->
  <rect width="800" height="560" fill="#26201A"/>
  <rect x="12" y="12" width="776" height="536" fill="none" stroke="#B97F24" stroke-width="2"/>
  <!-- left: identity -->
  <g transform="translate(64,64)">
    <g transform="translate(0,0)">
      <path d="M0 46 V21 C0 4 46 4 46 21 V46" stroke="#E8A33D" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M23 18 C23 18 32 31 32 37 A9 9 0 1 1 14 37 C14 31 23 18 23 18 Z" fill="#E8A33D"/>
    </g>
    <text x="66" y="30" font-family="Archivo, sans-serif" font-weight="800" font-size="21" letter-spacing="8" fill="#FBFAF6">SAFA</text>
    <text x="66" y="49" font-family="Archivo, sans-serif" font-weight="700" font-size="9.5" letter-spacing="5" fill="#E8A33D">NUTRITION</text>
  </g>
  <text x="64" y="220" font-family="Newsreader, Georgia, serif" font-size="64" fill="#FBFAF6">Sidr Sticks</text>
  <text x="64" y="266" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="24" fill="#E8A33D">the same Wadi Do&#8217;an harvest — one spoon at a time</text>
  <g font-family="Archivo, sans-serif" font-size="16" fill="#FBFAF6">
    <line x1="64" y1="306" x2="500" y2="306" stroke="#B97F24" stroke-width="1.6"/>
    <text x="64" y="342">Contents</text><text x="500" y="342" text-anchor="end" font-weight="700">12 sticks × 10 g</text>
    <line x1="64" y1="356" x2="500" y2="356" stroke="#B97F24" stroke-width=".7" opacity=".4"/>
    <text x="64" y="390">Honey</text><text x="500" y="390" text-anchor="end" font-weight="700">raw Sidr, batch SF-25-011</text>
    <line x1="64" y1="404" x2="500" y2="404" stroke="#B97F24" stroke-width=".7" opacity=".4"/>
    <text x="64" y="438">Pollen verified</text><text x="500" y="438" text-anchor="end" font-weight="700" fill="#7FBF95">monofloral — report enclosed</text>
  </g>
  <text x="64" y="500" font-family="Archivo, sans-serif" font-weight="800" font-size="17" fill="#FBFAF6">NET 120 g</text>
  <text x="500" y="500" text-anchor="end" font-family="Amiri, serif" font-size="36" fill="#E8A33D">صفا</text>
  <!-- right: a stick, actual size suggestion -->
  <g transform="translate(596,84)">
    <rect x="0" y="0" width="120" height="392" rx="14" fill="#B97824"/>
    <rect x="0" y="0" width="120" height="392" rx="14" fill="none" stroke="#E8A33D" stroke-width="1.5"/>
    <rect x="14" y="26" width="92" height="120" rx="4" fill="#FBFAF6"/>
    <g transform="translate(44,44)">
      <path d="M0 30 V14 C0 -4 32 -4 32 14 V30" stroke="#26201A" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M16 8 C16 8 24 19 24 24 A8 8 0 1 1 8 24 C8 19 16 8 16 8 Z" fill="#B97F24"/>
    </g>
    <text x="60" y="122" text-anchor="middle" font-family="Newsreader, serif" font-size="14" fill="#26201A">Sidr — 10 g</text>
    <text x="60" y="196" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" font-size="10" letter-spacing="2.5" fill="#FBFAF6" transform="rotate(90 60 196)"></text>
    <text x="60" y="330" text-anchor="middle" font-family="Newsreader, serif" font-style="italic" font-size="13" fill="#FBFAF6">tear · pour · done</text>
  </g>
</svg>
