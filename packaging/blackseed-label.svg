<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="500" height="800">
  <title>SAFA Black Seed Oil — bottle front label, 50×80 mm</title>
  <rect width="500" height="800" fill="#FBFAF6"/>
  <rect x="12" y="12" width="476" height="776" fill="none" stroke="#26201A" stroke-width="2.5"/>
  <!-- masthead -->
  <g transform="translate(222,46)">
    <path d="M0 50 V23 C0 5 50 5 50 23 V50" stroke="#26201A" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M25 20 C25 20 35 34 35 41 A10 10 0 1 1 15 41 C15 34 25 20 25 20 Z" fill="#B97F24"/>
  </g>
  <text x="250" y="138" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="22" letter-spacing="9" fill="#26201A">SAFA</text>
  <text x="250" y="160" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" font-size="10" letter-spacing="6" fill="#8A5A17">NUTRITION</text>
  <!-- name -->
  <text x="250" y="238" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="42" fill="#26201A">Black Seed Oil</text>
  <text x="250" y="276" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="20" fill="#8A5A17">Nigella sativa — Ethiopian seed</text>
  <text x="250" y="310" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" font-size="12.5" letter-spacing="3.5" fill="#675E53">COLD-PRESSED ≤ 40 °C · UNREFINED</text>
  <!-- the TQ grade: the front-of-pack number -->
  <line x1="60" y1="348" x2="440" y2="348" stroke="#26201A" stroke-width="2"/>
  <text x="250" y="452" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="900" font-size="88" fill="#26201A">TQ 2.1%</text>
  <text x="250" y="492" text-anchor="middle" font-family="Newsreader, serif" font-style="italic" font-size="18" fill="#8A5A17">thymoquinone, verified by HPLC — this batch</text>
  <line x1="60" y1="524" x2="440" y2="524" stroke="#26201A" stroke-width="2"/>
  <!-- ledger -->
  <g font-family="Archivo, sans-serif" font-size="15" fill="#26201A">
    <text x="70" y="562">Pressing</text><text x="430" y="562" text-anchor="end" font-weight="700">mechanical, solvent-free</text>
    <line x1="60" y1="576" x2="440" y2="576" stroke="#26201A" stroke-width="0.8" opacity=".25"/>
    <text x="70" y="606">Harvest</text><text x="430" y="606" text-anchor="end" font-weight="700">2025</text>
    <line x1="60" y1="620" x2="440" y2="620" stroke="#26201A" stroke-width="0.8" opacity=".25"/>
    <text x="70" y="650">Batch</text><text x="430" y="650" text-anchor="end" font-weight="700">SF-25-031</text>
  </g>
  <!-- footer -->
  <g transform="translate(70,686)">
    <rect width="72" height="72" fill="#FFFFFF" stroke="#26201A" stroke-width="1.6"/>
    <g transform="translate(7,7) scale(1.76)" fill="#26201A">
      <path d="M0 0h9v9H0zM2 2h5v5H2zM24 0h9v9h-9zM26 2h5v5h-5zM0 24h9v9H0zM2 26h5v5H2zM12 0h3v3h-3zM18 3h3v3h-3zM12 6h3v3h-3zM15 9h3v3h-3zM21 12h3v3h-3zM12 12h3v3h-3zM27 12h3v3h-3zM3 12h3v3h-3zM9 15h3v3h-3zM15 15h3v3h-3zM24 18h3v3h-3zM30 18h3v3h-3zM12 21h3v3h-3zM18 21h3v3h-3zM12 27h3v3h-3zM18 27h3v3h-3zM24 24h3v3h-3zM27 27h3v3h-3zM30 30h3v3h-3z"/>
    </g>
  </g>
  <text x="160" y="712" font-family="Archivo, sans-serif" font-size="13" fill="#675E53">batch chromatogram</text>
  <text x="160" y="730" font-family="Archivo, sans-serif" font-size="13" fill="#675E53">&amp; full report</text>
  <text x="430" y="716" text-anchor="end" font-family="Amiri, serif" font-size="34" fill="#26201A">صفا</text>
  <text x="430" y="748" text-anchor="end" font-family="Archivo, sans-serif" font-weight="800" font-size="15" fill="#26201A">100 ml</text>
</svg>
