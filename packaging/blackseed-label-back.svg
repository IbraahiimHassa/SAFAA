  <text x="48" y="80" font-family="Newsreader, Georgia, serif" font-size="28" fill="#26201A">Black Seed Oil — the record</text>
  <line x1="48" y1="108" x2="452" y2="108" stroke="#26201A" stroke-width="2"/>
  <text x="48" y="146" font-family="Archivo, sans-serif" font-weight="800" font-size="13" letter-spacing="2.5" fill="#8A5A17">HOW TO USE</text>
  <text x="48" y="176" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">One teaspoon (5 ml) daily, plain or in honey.</text>
  <text x="48" y="198" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Peppery by nature — that is the seed, not a flaw.</text>
  <line x1="48" y1="228" x2="452" y2="228" stroke="#26201A" stroke-width="2"/>
  <text x="48" y="264" font-family="Archivo, sans-serif" font-weight="800" font-size="13" letter-spacing="2.5" fill="#8A5A17">PER 5 ML</text>
  <text x="48" y="294" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Cold-pressed N. sativa oil</text><text x="452" y="294" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="13.5" fill="#26201A">5 ml (100%)</text><line x1="48" y1="302" x2="452" y2="302" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="48" y="326" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Thymoquinone (this batch)</text><text x="452" y="326" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="13.5" fill="#26201A">2.1% — HPLC</text><line x1="48" y1="334" x2="452" y2="334" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="48" y="358" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Energy</text><text x="452" y="358" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="13.5" fill="#26201A">185 kJ / 45 kcal</text><line x1="48" y1="366" x2="452" y2="366" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="48" y="390" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Fat</text><text x="452" y="390" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="13.5" fill="#26201A">5 g</text><line x1="48" y1="398" x2="452" y2="398" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
  <line x1="48" y1="428" x2="452" y2="428" stroke="#26201A" stroke-width="2"/>
