<text x="48" y="524" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Pressing</text><text x="452" y="524" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="13.5" fill="#26201A">mechanical, ≤ 40 °C</text><line x1="48" y1="532" x2="452" y2="532" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="48" y="556" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Solvents</text><text x="452" y="556" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="13.5" fill="#26201A">none — verified</text><line x1="48" y1="564" x2="452" y2="564" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
<text x="48" y="588" font-family="Archivo, sans-serif" font-size="13.5" fill="#26201A">Batch</text><text x="452" y="588" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="13.5" fill="#26201A">SF-25-031</text><line x1="48" y1="596" x2="452" y2="596" stroke="#26201A" stroke-width="0.7" opacity="0.2"/>
  <text x="48" y="646" font-family="Archivo, sans-serif" font-size="12.5" fill="#26201A">Food supplement. Keep out of reach of children. Not a</text>
  <text x="48" y="666" font-family="Archivo, sans-serif" font-size="12.5" fill="#26201A">substitute for a varied diet. Consult a doctor in pregnancy.</text>
